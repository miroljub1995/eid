# Builds every platform and, for a pushed `v*` tag, publishes them as a GitHub release.
# Run it by hand (Actions › Release › Run workflow) to build without releasing; the files are then
# attached to the run as artifacts.
#
# Optional repository secrets:
#   ANDROID_KEYSTORE           base64 of a release keystore (else the APK is signed with a debug key)
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcsclite-dev
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" -p eid-viewer -p eid-cli
          done
      - name: Package
        run: |
          mkdir -p dist/universal
          for bin in eid-viewer eid; do
            lipo -create -output "dist/universal/$bin" \
              "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          done
          codesign --force --sign - dist/universal/eid
          packaging/macos/bundle.sh dist/universal/eid-viewer dist/universal
          (cd dist/universal && zip -qry ../eid-macos-universal.zip eID.app eid)
      - uses: actions/upload-artifact@v4
        with:
          name: eid-macos-universal
          path: dist/eid-macos-universal.zip

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p eid-viewer -p eid-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/eid-viewer.exe, target/release/eid.exe -DestinationPath dist/eid-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: eid-windows-x64
          path: dist/eid-windows-x64.zip

  linux:
    needs: test
    strategy:
      # Let both architectures finish, so one failure doesn't hide the other's result.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # In containers: a static musl CLI, and the app against glibc 2.35 with libpcsclite linked in.
      - name: Build
        run: packaging/linux/build.sh
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/eid-linux-${{ matrix.arch }}.tar.gz" -C target/linux-dist eid-viewer eid
      - uses: actions/upload-artifact@v4
        with:
          name: eid-linux-${{ matrix.arch }}
          path: dist/eid-linux-${{ matrix.arch }}.tar.gz

  android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p target/apk
            echo "$KEYSTORE" | base64 -d > target/apk/release.keystore
            echo "CARGO_APK_RELEASE_KEYSTORE=target/apk/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          packaging/android/build.sh
          mkdir -p dist
          cp target/apk/release/apk/eid.apk dist/eid-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: eid-android
          path: dist/eid-android.apk

  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-ios && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (unsigned; signing needs your Apple identity)
        run: |
          ipa=$(apps/eid-ios/bundle.sh | tail -1)
          mkdir -p dist
          cp "$ipa" dist/eID-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: eid-ios
          path: dist/eID-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
